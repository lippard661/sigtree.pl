# Sample config for "sigtree verify_hosts" (sigtree 1.29 and later), run
# on a server that collects other hosts' sigtree databases. Install as
# /etc/sigtree.hosts.conf, owned by root, mode 0600 (or name another
# file with -c).

# Where the daily pull of each host's /var/db/sigtree lands: the host's
# specs are in <spec-root>/specs/<host>/ and <spec-root>/specs/<host>.spec,
# and its changed file is <spec-root>/specs/<host>.changed.
spec-root: /var/db/sigtree

# rsnapshot's snapshot_root. Each snapshot (hourly.N, daily.N, weekly.N,
# monthly.N) holds a directory per host; a host's sigtree directory is at
# <snapshot-root>/<snapshot>/<host>/<snapshot-subdir>. Leave snapshot-root
# out to skip the snapshot checks.
snapshot-root: /mnt/usb/backup
snapshot-subdir: var/db/sigtree
current-snapshot: daily.0
previous-snapshot: daily.1

# Report a host whose changed file is older than this many hours.
max-age: 36

# Peer comparison: files under these paths are expected to be the same on
# every peer (same OS release and patch level). A path matches itself and
# everything beneath it; * and ? match within one path component.
common: /bin /sbin /usr/bin /usr/sbin /usr/libexec
common: /usr/libdata/perl5
common: /etc/examples

# Files that differ between hosts by design. OpenBSD relinks some files at
# every boot in a random order (the kernel, ld.so, libc, libcrypto, sshd
# and a few others); check the list for your release under /usr/share/relink
# and adjust these.
except: /bsd /bsd.mp /bsd.sp /bsd.booted /bsd.syspatch*
except: /usr/libexec/ld.so
except: /usr/lib/libc.so.* /usr/lib/libcrypto.so.*
except: /usr/sbin/sshd /usr/libexec/sshd-session /usr/libexec/sshd-auth

# Attributes compared between peers: any of type, shadigest, mode, uid,
# gid, link, size, flags, nlink. The peers must use the same digest
# (sha2_digest/sha3_digest) and include it in the sets for these trees.
attributes: type,shadigest,mode,uid,gid,link

# One block per host. key: is the second line of the host's sigtree
# signify public key (the base64 line), pinned here so that a host cannot
# change it; key-copy: (optional) is a copy of that public key elsewhere,
# reported if it stops matching. A host without key: gets the changed-file
# and snapshot checks only. peer: yes includes it in the comparison, which
# needs a key, since a spec is loaded only after its signature verifies.
host: alpha
key: RWQ...replace.with.alpha's.key...
peer: yes

host: beta
key: RWQ...replace.with.beta's.key...
peer: yes

host: pve
peer: no
