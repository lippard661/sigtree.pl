# Sample config for "sigtree verify_hosts" (sigtree 1.29 and later), run
# on a server that collects other hosts' sigtree databases. Install as
# /etc/sigtree.hosts.conf, owned by root, mode 0600 (or name another
# file with -c).

# Where the daily pull of each host's /var/db/sigtree lands: the host's
# specs are in <spec-root>/specs/<host>/ and <spec-root>/specs/<host>.spec,
# and its changed file is <spec-root>/specs/<host>.changed.
spec-root: /var/db/sigtree

# rsnapshot's snapshot_root. Each snapshot (hourly.N, daily.N, weekly.N,
# monthly.N) holds a directory per host; a host's sigtree directory is at
# <snapshot-root>/<snapshot>/<host>/<snapshot-subdir>. Leave snapshot-root
# out to skip the snapshot checks.
snapshot-root: /mnt/usb/backup
snapshot-subdir: var/db/sigtree
current-snapshot: daily.0
previous-snapshot: daily.1
# Or, instead of previous-snapshot, the newest snapshot at least this many
# days older than the current one (1.30 and later); for a weekly run:
# previous-age: 7

# Report a host whose changed file is older than this many hours (for a
# weekly run after the weekly checks, about 175).
max-age: 36

# Peer comparison: files under these paths are expected to be the same on
# every peer (same OS release and patch level). A path matches itself and
# everything beneath it; * and ? match within one path component.
common: /bin /sbin /usr/bin /usr/sbin /usr/libexec
common: /usr/libdata/perl5
common: /etc/examples

# Files that differ between hosts by design. OpenBSD relinks some files at
# every boot in a random order: the kernel, ld.so, libc, libcrypto, and
# the smtpd, ssh and httpd binaries below (OpenBSD 8.0); check the list
# for your release under /usr/share/relink and adjust these.
except: /bsd /bsd.mp /bsd.sp /bsd.booted /bsd.syspatch*
except: /usr/libexec/ld.so /usr/libexec/ld.so.save
except: /usr/libexec/smtpd-ca /usr/libexec/smtpd-control /usr/libexec/smtpd-dispatcher
except: /usr/libexec/smtpd-lka /usr/libexec/smtpd-queue /usr/libexec/smtpd-scheduler /usr/sbin/smtpd
except: /usr/lib/libc.so.* /usr/lib/libcrypto.so.*
except: /usr/bin/ssh-agent /usr/sbin/sshd /usr/libexec/sshd-session /usr/libexec/sshd-auth
except: /usr/sbin/httpd

# Attributes compared between peers: any of type, shadigest, mode, uid,
# gid, link, size, flags, nlink, rdev. The peers must use the same digest
# (sha2_digest/sha3_digest) and include it in the sets for these trees.
attributes: type,shadigest,mode,uid,gid,link

# Files on this server (where verify_hosts runs) that every host must
# have, the same (1.30 and later); reference-hosts: limits it to some.
# A host whose copy differs, or whose specs have none, is reported.
# reference: /etc/rsync/rsync.conf /etc/reportnew/reportnew.conf

# One block per host. key: is the second line of the host's sigtree
# signify public key (the base64 line), pinned here so that a host cannot
# change it; key-copy: (optional) is a copy of that public key elsewhere,
# reported if it stops matching. A host without key: gets the changed-file
# and snapshot checks only. peer: yes includes it in the comparison, which
# needs a key, since a spec is loaded only after its signature verifies.
host: alpha
key: RWQ...replace.with.alpha's.key...
peer: yes

host: beta
key: RWQ...replace.with.beta's.key...
peer: yes

host: pve
peer: no

# Chroots (1.30 and later): one block per chroot. The hosts named in
# chroot-hosts: need a key, and their specs must cover the chroot and the
# system paths it mirrors (with digests, and rdev for dev/). Paths below
# are relative to the chroot.
#   mirror:        directories (or files) that are copies of the same
#                  paths on the host's own system; each file there must
#                  match the system's copy, and any with no system copy is
#                  reported unless listed in allow-extra:
#   mirror-except: files that differ from the system's by design, such as
#                  a wrapper or a separately built binary installed in
#                  place of the system's. Libraries and binaries relinked
#                  at boot are best left in the check: when the system's
#                  copy is relinked (after a patch or upgrade), the
#                  difference is the signal to re-run the chroot build.
#   allow-only:    the only files allowed in their directories (here etc/)
#   allow-extra:   files in mirrored directories that have no system copy
#   rules-except:  paths exempt from the setuid and ownership rules
#   compare-except: paths in the system parts that may differ between
#                  the hosts' copies of the chroot
# Everywhere in a chroot, setuid/setgid files and device nodes outside
# dev/ are reported; in mirrored directories, dev/ and etc/, anything not
# owned by root or writable by group or others (device nodes excepted).
# In the system parts (mirrored directories, dev/, etc/), files that every
# listed host's copy of the chroot has must match; the rest (htdocs,
# cgi-bin, logs) is each host's own and is not compared.
# (system-root: names another root for the system side; default /.)
chroot: /var/www
chroot-hosts: alpha, beta
mirror: bin sbin usr/bin usr/lib usr/libexec usr/libdata dev
allow-only: etc/localtime etc/resolv.conf
